name: notion-blog
on:
  # On pull requests commits
  # Automatic trigger every 2 hours
  schedule:
    - cron: "0 */2 * * *"
  # Manual trigger
  workflow_dispatch:
# contents: write lets the sync job's prettier step push the synced
# articles back to the repo (GITHUB_TOKEN needs write for that). The later
# build-and-deploy job then fetches that freshly-pushed commit.
permissions:
  contents: write
  pages: write
  id-token: write
# Allow only one deployment at a time, skipping queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  auto-sync-from-notion-to-github:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: notion-blog
        uses: rxrw/notion-blog@master
        env:
          # The env var name NOTION_SECRET is fixed (the Action reads
          # os.Getenv("NOTION_SECRET")); its value comes from the repo secret,
          # which is named NOTION_TOKEN.
          NOTION_SECRET : ${{ secrets.NOTION_TOKEN }}

      - name: Clean up offline articles
        # The notion-blog Action only ever ADDS/updates files — it never deletes.
        # So once an article is synced, changing its Notion Status away from
        # "Finished" (e.g. to 未开始/进行中, or to the dedicated "Offline" status
        # to take it down) would leave a stale .md in the repo and the post would
        # stay live forever.
        #
        # This step fixes that. It asks Notion for the CURRENT set of articles
        # whose Status is Finished (about to sync) OR Published (already synced
        # — the Action flips Status to "Published" right after a successful sync,
        # so a Published post must be KEPT, not deleted), computes the expected
        # .md filenames the same way the Action does, and `git rm`s any .md under
        # content/zh that isn't in that set. Anything NOT Finished/Published —
        # drafts (未开始/进行中) or explicitly-offline (Offline) — gets removed.
        # Result: flip a post's Status in Notion and the next run removes it from
        # the blog automatically.
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys, urllib.request
          TOKEN = os.environ["NOTION_TOKEN"]
          DB = "3ab13513efe3806ba544c53ca8058cbb"
          H = {"Authorization": f"Bearer {TOKEN}", "Notion-Version": "2022-06-28", "Content-Type": "application/json"}
          CONTENT_DIR = "content/zh"
          CATEGORY_MAP = {"技术": "tech", "随笔": "essay", "关于": "about"}
          # Keep Finished (pending sync) AND Published (already synced). Deleting
          # Published would wipe a post the moment the Action marks it Published.
          KEEP_STATUSES = {"Finished", "Published"}

          def expected_filename(title, category_name):
              # Replicate the Action's generateArticleName: lower, drop invalid
              # UTF-8, spaces -> underscores, append .md. "_index" -> "_index.md".
              name = title.lower().replace(" ", "_")
              if "_index" in name:
                  name = "_index"
              fname = name + ".md"
              # Category folder: 首页/_index -> root, else categoryMap[name].
              category = ""
              if category_name not in ("首页", "_index"):
                  category = CATEGORY_MAP.get(category_name, "").lower()
              return os.path.join(CONTENT_DIR, category, fname).replace("\\", "/")

          def query_all():
              # Notion returns max 100 pages per request; page through cursors.
              results, cursor = [], None
              while True:
                  body = {"page_size": 100}
                  if cursor:
                      body["start_cursor"] = cursor
                  req = urllib.request.Request(
                      f"https://api.notion.com/v1/databases/{DB}/query",
                      data=json.dumps(body).encode(), headers=H, method="POST")
                  data = json.loads(urllib.request.urlopen(req, timeout=30).read())
                  results.extend(data["results"])
                  if data.get("has_more") and data.get("next_cursor"):
                      cursor = data["next_cursor"]
                  else:
                      break
              return results

          try:
              articles = query_all()
          except Exception as e:
              # Cleanup is best-effort: a Notion hiccup must NOT block the commit
              # of articles the Action just synced. Skip cleanup and exit clean.
              print(f"::warning::Notion query failed ({e}); skipping cleanup.")
              sys.exit(0)

          expected = set()
          for p in articles:
              title = "".join(x.get("plain_text", "") for x in p["properties"]["Name"]["title"])
              st = p["properties"]["Status"]["status"]
              stname = st["name"] if st else None
              cat = p["properties"]["Category"]["select"]
              catname = cat["name"] if cat else ""
              if stname in KEEP_STATUSES:
                  expected.add(expected_filename(title, catname))

          actual = set()
          # Hand-maintained translations use Hugo's by-filename suffix (.<lang>.md),
          # e.g. content/zh/welcome.en.md is the English version of the site's
          # welcome page. The Notion Action never creates these (it only writes
          # default-language <name>.md), so they are NOT in `expected`. Without
          # this exclusion they'd be git rm'd on every run. Add lang codes here
          # if more hand-maintained translations are added.
          TRANSLATION_SUFFIXES = (".en.md",)
          for root, _, files in os.walk(CONTENT_DIR):
              for f in files:
                  if not f.endswith(".md"):
                      continue
                  if f.endswith(TRANSLATION_SUFFIXES):
                      continue  # keep hand-maintained translations
                  actual.add(os.path.join(root, f).replace("\\", "/"))

          to_delete = sorted(actual - expected)
          print(f"Keep {len(expected)} article(s); found {len(actual)} .md file(s); {len(to_delete)} to delete.")
          for d in to_delete:
              print(f"  git rm {d}")
              # arg list, not a shell string -> no quoting/injection worries.
              subprocess.run(["git", "rm", "-f", "--", d], check=False)
          if not to_delete:
              print("No offline articles to clean up.")
          PYEOF

      - name: Fix tags front-matter format
        # The notion-blog Action renders the multi-select Tags into the archetype
        # template as `tags : {{.Tags}}`, where .Tags is a []string. Go's default
        # slice rendering is "[a b c]" (space-separated, no commas). Hugo's YAML
        # parser accepts that as a SINGLE tag named "a b c" instead of three tags,
        # so /tags/ and per-post tag lists show one mangled tag instead of N.
        #
        # This step rewrites every content/zh/**/*.md front-matter `tags : [...]`
        # line so elements are comma-separated. Only touches the tags line inside
        # the front matter (between the --- fences); leaves body and other fields
        # alone. Idempotent: already-comma-separated or empty [] lines are skipped.
        #
        # CONSTRAINT: tag names must NOT contain spaces. The Action's "[a b c]"
        # output is space-separated, so a tag like "GitHub Pages" is ambiguous and
        # cannot be reconstructed losslessly here. Use hyphenated names instead
        # (e.g. "GitHub-Pages"). The script splits on whitespace, so a spaced name
        # would be wrongly broken into two tags.
        run: |
          python3 - <<'PYEOF'
          import glob, re
          fixed = 0
          for path in glob.glob("content/zh/**/*.md", recursive=True):
              with open(path, encoding="utf-8") as f:
                  lines = f.readlines()
              # Locate the front matter (between leading --- and the next ---).
              if not lines or not lines[0].strip() == "---":
                  continue
              end = None
              for i in range(1, len(lines)):
                  if lines[i].strip() == "---":
                      end = i
                      break
              if end is None:
                  continue
              changed = False
              for i in range(1, end):
                  m = re.match(r"^tags\s*:\s*\[(.*)\]\s*$", lines[i])
                  if not m:
                      continue
                  inner = m.group(1).strip()
                  if inner == "":
                      continue  # tags : []  -> leave empty
                  # Split on whitespace (see CONSTRAINT above: no spaces in names).
                  parts = inner.replace(",", " ").split()
                  # de-dup while preserving order
                  seen, uniq = set(), []
                  for p in parts:
                      if p not in seen:
                          seen.add(p); uniq.append(p)
                  if not uniq:
                      continue
                  new = "tags : [" + ", ".join(uniq) + "]\n"
                  if new != lines[i]:
                      lines[i] = new
                      changed = True
              if changed:
                  with open(path, "w", encoding="utf-8") as f:
                      f.writelines(lines)
                  fixed += 1
                  print(f"fixed tags in {path}")
          print(f"Total files fixed: {fixed}")
          PYEOF

      - name: Fix migrated article dates
        # The notion-blog Action sets each article's front-matter `date:` from
        # the Notion page's created_time. That is a read-only system field
        # auto-set to *now* on page creation and not overridable via the API,
        # so the 9 articles migrated from the old Gridea blog (originally dated
        # 2021-2023) would all land with today's date and pile up at the top of
        # the archives as "newest".
        #
        # This step runs on every sync (self-healing), after the Action writes
        # the .md files and after fix-tags, before the commit. It looks up each
        # article's title in scripts/migrated-dates.json (title -> original
        # YYYY-MM-DD) and rewrites the `date:` and `lastmod:` front-matter lines
        # of matching content/zh/**/*.md back to the original date, so the
        # migrated posts sort and display with their real publication dates.
        # Idempotent: a file already on the right date is left untouched; remove
        # an entry from the mapping to stop patching it (the Action's date then
        # wins again).
        run: python3 scripts/fix-migrated-dates.py

      - name: Commit synced articles
        # Commit & push the markdown that notion-blog just generated under
        # content/zh (and any downloaded images under static/images), plus any
        # deletions staged by the cleanup step above and the tag-format fixes
        # from the step above. We use plain git instead of a prettier action:
        # the upstream prettier action is pinned to an old Node and rewrites
        # Notion's markdown structure, which corrupts code blocks/tables.
        # Nothing to commit is fine. `git add` of a path that doesn't exist
        # (e.g. static/images when the article has no images) would fatal-exit,
        # so add each path tolerantly. Deletions are already staged by `git rm`
        # above, so we only `git add` for new/modified files.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/zh 2>/dev/null || true
          git add static/images 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No article changes to commit."
          else
            git commit -m "notion-blog: update articles (auto)"
            git push
          fi

  # Build the Hugo site and deploy it to GitHub Pages.
  # Runs after the sync job so freshly pulled articles are published too.
  build-and-deploy:
    needs: auto-sync-from-notion-to-github
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        # The sync job commits new articles with the default GITHUB_TOKEN.
        # A checkout pinned to the run's original SHA would miss those commits,
        # so below we reset to the freshly-pushed branch tip.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          submodules: recursive

      - name: Pull latest commits (incl. just-synced articles)
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
          git submodule update --init --recursive
          echo "Checked out $(git log -1 --format='%h %s')"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Stack theme requires the Hugo extended build (SCSS support).
          # Pinned to 0.163.3: the submodule pins hugo-theme-stack at v4.0.3,
          # whose module.toml declares min_version 0.157.0. MemE used to force
          # 0.112.7 because its old resources.ToCSS usage broke on newer Hugo;
          # switching themes lifted that constraint. NOTE: the 0.157 line has
          # ONLY 0.157.0 — there is no 0.157.1/0.157.2 release (tried 0.157.2,
          # the action failed "Unable to find a compatible Hugo release asset").
          # 0.163.3 is a mature .3 patch, comfortably above Stack's floor.
          hugo-version: '0.163.3'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        # A custom domain (notion.dongxiaoqi.top) is set via static/CNAME,
        # so we must build with the custom baseURL from config.toml — NOT the
        # github.io URL that configure-pages reports. Overriding --baseURL with
        # the latter would make every internal link 404 under the custom domain.
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --destination public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
