##########################################
# 站点配置

baseURL = "https://notion.dongxiaoqi.top/"
title = "dongxiaoqi's Blog"
hasCJKLanguage = true
# 版权信息（支持 Markdown）
copyright = "CC BY-NC-SA 4.0"

# 主题选择（hugo-theme-stack，submodule 在 themes/stack，锁 v4.0.3）
theme = "stack"

# i18n
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

# 语言定义
# Hugo ≥0.158.0 弃用顶层 languageCode；≥0.163.x 又把 [languages.<code>] 下的
# languageCode/languageName 改名为 locale/label。这里用最新键名，构建无弃用警告。
# 风险：显式加 [languages.zh] 后 Hugo 可能把 content/zh/ 当 zh 语言根目录而非 section，
#       若如此则 mainSections=["zh"] / permalinks zh="/p/:slug/" 会失配，首页变空、URL 变。
#       本地构建已验证：仍为 section，首页 2 篇文章、/p/ URL 不变、无弃用警告。
[languages]
    [languages.zh]
        locale = "zh-CN"
        label = "中文"
        weight = 1

    # 第二语言：开启 hugo.IsMultilingual 后 Stack 侧边栏才渲染语言切换下拉框
    # （见 themes/stack/layouts/_partials/sidebar/left.html 的 {{ if hugo.IsMultilingual }}）。
    # 英语内容用 Hugo by-filename 机制：手工维护 content/zh/welcome.en.md（.en 后缀归
    # 英语语言，content/zh/ 目录让它共享 section "zh"，所以 mainSections/permalinks 不用改）。
    # 默认语言 zh 从 content/ 根扫描，content/en/ 会被吞成 zh 的 section，故不能用
    # content/en/ 目录放英语内容——只能用 .en.md 文件后缀。
    [languages.en]
        locale = "en-US"
        label = "English"
        weight = 2

        # 英文站目前只有欢迎页，不需要搜索/归档/标签云/分类组件。
        # 覆盖为空 → en 走紧凑布局（无右侧栏），也消除 widget 在 en 上下文
        # 找不到 search/archives 页和空 taxonomy 时的 warnf。中文站不受影响。
        [languages.en.params.widgets]
            homepage = []
            page = []

# 分页
[pagination]
    pagerSize = 5

# URL 结构
[permalinks]
    # 文章在 content/zh/，section 名为 zh。Stack 默认用 /p/:slug/ 风格。
    # 切换主题后文章 URL 从 /zh/xxx/ 变 /p/xxx/。
    zh = "/p/:slug/"
    page = "/:slug/"

# 类别（Hugo 默认）
[taxonomies]
    category = "categories"
    tag = "tags"

# 修改时间
[frontmatter]
    lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

# Markdown 渲染器（Stack 推荐配置）
[markup]
    [markup.goldmark]
        [markup.goldmark.extensions]
            definitionList = true
            footnote = true
            linkify = true
            strikethrough = true
            table = true
            taskList = true
            typographer = false
            [markup.goldmark.extensions.passthrough]
                enable = true
                [markup.goldmark.extensions.passthrough.delimiters]
                    block  = [['\[', '\]'], ['$$', '$$']]
                    inline = [['\(', '\)']]
        [markup.goldmark.parser]
            attribute = true
            autoHeadingID = true
            autoHeadingIDType = "github"
        [markup.goldmark.renderer]
            hardWraps = false
            unsafe = true
            xHTML = false
    [markup.highlight]
        codeFences = true
        guessSyntax = true
        lineNos = true
        lineNumbersInTable = true
        lineNoStart = 1
        noClasses = false
        tabWidth = 4
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 4
        ordered = true

# 相关文章（Stack 推荐配置）
[related]
    includeNewer = true
    threshold = 60
    toLower = false
    [[related.indices]]
        name = "tags"
        weight = 100
    [[related.indices]]
        name = "categories"
        weight = 200

# 压缩 HTML
[minify.tdewolff.html]
    keepWhitespace = false


##########################################
# 菜单配置（Stack 格式：main 顶部菜单 + social 社交图标）

[menu]
    [[menu.main]]
        identifier = "home"
        name = "首页"
        url = "/"
        weight = 1
        [menu.main.params]
            icon = "home"

    [[menu.main]]
        identifier = "tech"
        name = "技术"
        # 注意：notion-blog Action 把文章的 Notion Category（select，中文「技术/随笔/关于」）
        # 原样写进 front matter 的 categories: 字段，categoryMap 只决定 content/zh 下的
        # 子目录名（tech/essay/about）。Hugo 是按 front matter 的 categories 值生成分类
        # 列表页的，所以实际分类页 URL 是中文 /categories/技术/ 而非英文 /categories/tech/。
        # 菜单必须指向 Hugo 真正生成的那条路径，否则 404。
        url = "/categories/技术/"
        weight = 2
        [menu.main.params]
            # icon 值必须对应 themes/stack/assets/icons/<name>.svg 里已有的图标
            # （Stack 内置 24 个，见主题 assets/icons/）。code/notes 不在内置集。
            icon = "categories"

    [[menu.main]]
        identifier = "essay"
        name = "随笔"
        # 随笔分类暂时还没有文章，/categories/随笔/ 会 404 —— 等以后在 Notion 建
        # Category=随笔 的文章后会自动出现。先保留菜单项占位。
        url = "/categories/随笔/"
        weight = 3
        [menu.main.params]
            icon = "archives"

    [[menu.main]]
        identifier = "about"
        name = "关于"
        url = "/categories/关于/"
        weight = 4
        [menu.main.params]
            icon = "user"

    [[menu.social]]
        identifier = "github"
        name = "GitHub"
        url = "https://github.com/vamViolet"
        [menu.social.params]
            icon = "brand-github"

    [[menu.social]]
        identifier = "csdn"
        name = "CSDN"
        url = "https://blog.csdn.net/qq_32332777"
        [menu.social.params]
            # CSDN 主题无内置图标，用项目 assets/icons/csdn.svg（自定义）
            icon = "csdn"

    [[menu.social]]
        identifier = "email"
        name = "Email"
        url = "mailto:dxq852783734@gmail.com"
        [menu.social.params]
            # email 用项目 assets/icons/email.svg（Tabler mail 图标）
            icon = "email"

    [[menu.social]]
        identifier = "rss"
        name = "RSS"
        url = "/index.xml"
        [menu.social.params]
            icon = "rss"


##########################################
# 主题参数（hugo-theme-stack）

[params]
    # mainSections 决定首页文章列表读哪个 section。
    # 文章由 Notion Action 同步到 content/zh/，section 名为 zh。
    mainSections = ["zh"]
    rssFullContent = true
    SortBy = "default"

    [params.footer]
        since = 2026
        customText = "CC BY-NC-SA 4.0"

    [params.dateFormat]
        published = ":date_full"
        lastUpdated = ":date_full"

    [params.sidebar]
        compact = false
        # 头像放 assets/img/，Stack 用 .Resources.Get 按此路径解析（必须在 assets/ 下，扩展名与实际文件一致）
        avatar = "img/avatar.jpeg"
        subtitle = "Viva La Vida"

    [params.article]
        headingAnchor = false
        math = false
        toc = true
        readingTime = true

        [params.article.list]
            # 文章列表（首页、分类页）显示标签
            showTags = true

        [params.article.license]
            enabled = false
            default = "Licensed under CC BY-NC-SA 4.0"

    [params.widgets]
        # 首页右侧栏组件（顺序即显示顺序）。v4 用「内联表数组」语法，每项 { type, params }。
        # 参考 themes/stack/demo/config/_default/params.toml。组件对应
        # themes/stack/layouts/_partials/widget/<type>.html，缺页面会 warnf。
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        # 文章页右侧栏：目录
        page = [{ type = "toc" }]

    [params.opengraph.twitter]
        site = ""
        card = "summary_large_image"

    [params.colorScheme]
        toggle = true
        default = "auto"

    [params.imageProcessing]
        autoOrient = false
        [params.imageProcessing.content]
            enabled = true
            widths = [800, 1600, 2400]
        [params.imageProcessing.thumbnail]
            enabled = true

    [params.comments]
        enabled = true
        provider = "giscus"

        # Giscus：基于 GitHub Discussions 的评论系统。
        # 访客用 GitHub 账号登录评论，评论存为仓库 Discussions。
        # 前置：仓库 public ✓、Discussions 已启用 ✓、需在 https://github.com/apps/giscus
        # 安装 Giscus App 并授权本仓库（让它能读 Discussions）——这是唯一手动步骤。
        # repo-id / category-id 通过 GitHub GraphQL API 直接取得，无需走 giscus.app。
        [params.comments.giscus]
            repo             = "vamViolet/notion-hugo-meme"
            repoID           = "R_kgDOTllGGw"
            category         = "Announcements"
            categoryID       = "DIC_kwDOTllGG84DDR7I"
            # 按文章 title 映射到 discussion（文章 URL 改了也不丢评论）
            mapping          = "title"
            # 严格匹配：title 必须完全一致才复用 discussion，避免误关联
            strict           = 0
            reactionsEnabled = 1
            emitMetadata     = 0
            inputPosition    = "top"
            # 跟随博客明暗主题
            lightTheme       = "light"
            darkTheme        = "dark_dimmed"
            lang             = "zh-CN"
            loading          = "lazy"
