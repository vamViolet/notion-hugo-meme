##########################################
# 站点配置

baseURL = "https://notion.dongxiaoqi.top/"
title = "dongxiaoqi's Blog"
languageCode = "zh-CN"
hasCJKLanguage = true
# 版权信息（支持 Markdown）
copyright = "CC BY-NC-SA 4.0"

# 主题选择（hugo-theme-stack，submodule 在 themes/stack，锁 v4.0.3）
theme = "stack"

# i18n
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false

# 是否生成 robots.txt 文件
enableRobotsTXT = true

# 分页
[pagination]
    pagerSize = 5

# URL 结构
[permalinks]
    # 文章在 content/zh/，section 名为 zh。Stack 默认用 /p/:slug/ 风格。
    # 切换主题后文章 URL 从 /zh/xxx/ 变 /p/xxx/。
    zh = "/p/:slug/"
    page = "/:slug/"

# 类别（Hugo 默认）
[taxonomies]
    category = "categories"
    tag = "tags"

# 修改时间
[frontmatter]
    lastmod = ["lastmod", ":git", ":fileModTime", ":default"]

# Markdown 渲染器（Stack 推荐配置）
[markup]
    [markup.goldmark]
        [markup.goldmark.extensions]
            definitionList = true
            footnote = true
            linkify = true
            strikethrough = true
            table = true
            taskList = true
            typographer = false
            [markup.goldmark.extensions.passthrough]
                enable = true
                [markup.goldmark.extensions.passthrough.delimiters]
                    block  = [['\[', '\]'], ['$$', '$$']]
                    inline = [['\(', '\)']]
        [markup.goldmark.parser]
            attribute = true
            autoHeadingID = true
            autoHeadingIDType = "github"
        [markup.goldmark.renderer]
            hardWraps = false
            unsafe = true
            xHTML = false
    [markup.highlight]
        codeFences = true
        guessSyntax = true
        lineNos = true
        lineNumbersInTable = true
        lineNoStart = 1
        noClasses = false
        tabWidth = 4
    [markup.tableOfContents]
        startLevel = 2
        endLevel = 4
        ordered = true

# 相关文章（Stack 推荐配置）
[related]
    includeNewer = true
    threshold = 60
    toLower = false
    [[related.indices]]
        name = "tags"
        weight = 100
    [[related.indices]]
        name = "categories"
        weight = 200

# 压缩 HTML
[minify.tdewolff.html]
    keepWhitespace = false


##########################################
# 菜单配置（Stack 格式：main 顶部菜单 + social 社交图标）

[menu]
    [[menu.main]]
        identifier = "home"
        name = "首页"
        url = "/"
        weight = 1
        [menu.main.params]
            icon = "home"

    [[menu.main]]
        identifier = "tech"
        name = "技术"
        url = "/categories/tech/"
        weight = 2
        [menu.main.params]
            icon = "code"

    [[menu.main]]
        identifier = "essay"
        name = "随笔"
        url = "/categories/essay/"
        weight = 3
        [menu.main.params]
            icon = "notes"

    [[menu.main]]
        identifier = "about"
        name = "关于"
        url = "/categories/about/"
        weight = 4
        [menu.main.params]
            icon = "user"

    [[menu.social]]
        identifier = "github"
        name = "GitHub"
        url = "https://github.com/vamViolet"
        [menu.social.params]
            icon = "brand-github"

    [[menu.social]]
        identifier = "rss"
        name = "RSS"
        url = "/index.xml"
        [menu.social.params]
            icon = "rss"


##########################################
# 主题参数（hugo-theme-stack）

[params]
    # mainSections 决定首页文章列表读哪个 section。
    # 文章由 Notion Action 同步到 content/zh/，section 名为 zh。
    mainSections = ["zh"]
    rssFullContent = true
    SortBy = "default"

    [params.footer]
        since = 2026
        customText = "CC BY-NC-SA 4.0"

    [params.dateFormat]
        published = ":date_full"
        lastUpdated = ":date_full"

    [params.sidebar]
        compact = false
        # 头像留空，Stack 显示默认占位；后续可放 assets/img/avatar.png 再填路径
        avatar = ""
        subtitle = "Viva La Vida"

    [params.article]
        headingAnchor = false
        math = false
        toc = true
        readingTime = true

        [params.article.list]
            # 文章列表（首页、分类页）显示标签
            showTags = true

        [params.article.license]
            enabled = false
            default = "Licensed under CC BY-NC-SA 4.0"

    [params.widgets]
        homepage = []
        page = []

    [params.opengraph.twitter]
        site = ""
        card = "summary_large_image"

    [params.colorScheme]
        toggle = true
        default = "auto"

    [params.imageProcessing]
        autoOrient = false
        [params.imageProcessing.content]
            enabled = true
            widths = [800, 1600, 2400]
        [params.imageProcessing.thumbnail]
            enabled = true

    [params.comments]
        enabled = false
        provider = "disqus"
